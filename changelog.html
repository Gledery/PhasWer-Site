<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>更新日志 | PhasWer 的小站</title>
    <link rel="icon" href="favicon.png" type="image/png">
    <link rel="apple-touch-icon" href="favicon.png">
    <link rel="stylesheet" href="css/core.css">
    <link rel="stylesheet" href="css/changelog.css">
</head>
<body>
<script src="js/layout.js"></script>
<header>
    <div class="logo-group">
        <img src="img/Phas-Wer-Dark.png" alt="PhasWer Logo">
    </div>
</header>
<main>
    <section class="page-hero">
        <h1 class="page-hero-title"><br>屎山是怎样炼成的 :</h1>
        <p class="page-hero-subtitle">
            <br>
                <strong>X.0.0</strong>：全局级调整，设计方向或底层架构的根本性变更且影响所有页面和模块<br>
                <strong>X.X.0</strong>：系统级调整，包括新增功能模块、整体重写某个页面或核心系统<br>
                <strong>X.X.X</strong>：组件级调整，单组件或页面改动、Bug 修复、性能优化、局部重构<br>
                <strong>X.X.X Debugged</strong>：问题修复或轻量内容新增，不纳入此页面<br>
                *Beta 和 Debugged 版本被我吃了<br>
        </p>
    </section>

    <div class="card card-transparent">
            <div class="changelog-body">
                <nav class="changelog-sidebar" id="sidebar"></nav>
                <div class="changelog-versions" id="versionList"></div>
            </div>
        </div>
    </div>
</main>
<script src="js/common.js"></script>
<script src="js/data/changelog-data.js"></script>
<script src="js/pages/changelog.js"></script>
</body>
</html>
