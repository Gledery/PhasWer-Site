<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Upers.io | PhasWer 的小站</title>
    <link rel="icon" href="favicon.png" type="image/png">
    <link rel="apple-touch-icon" href="favicon.png">
    <link rel="stylesheet" href="css/core.css">
    <link rel="stylesheet" href="css/upio.css">
</head>
<body>
<script src="js/layout.js"></script>
<header>
    <div class="logo-group">
        <img src="img/UPIO-Logo.png" alt="Upers.io Logo">
    </div>
</header>
<main>
  <section id="welcome-section" style="margin: 60px auto 0px; max-width: 900px; text-align: center;">
    <h2 style="margin-top: 0;">欢迎来到 Upers.io</h2>
    <p style="font-size: 16px; line-height: 2;">
      Upers.io 是由灰鸢Gledery于2025年6月8日发起的一个Florr.io游戏社区和公会，欢迎所有Flower！<br>
      Upers取Unique+Super的含义，当然也读作"You-pers"（当然只要你乐意读什么都好）(。・ω・。)<br>
      等级≥60级即可通过微信加入公会<br>
    </p>
    <div style="display: flex; align-items: center; justify-content: center; gap: 20px; margin-top: 20px;">
      <img src="img/florr.webp" alt="Florr.io Logo" style="height: 75px; width: auto;transform: translateY(10px);">
      <a href="https://florr.io" class="big-button" target="_blank">前往游戏</a>
    </div>
  </section>

  <div class="card" id="members-list">
    <h2 class="section-title">公会成员</h2>
    <div id="members-container" style="text-align: center;"></div>
  </div>

  <div class="card">
    <h2 class="section-title">详细信息</h2>
    <div class="player-stats-scroll-wrapper">
      <div class="player-stats-container" id="players-container"></div>
    </div>
  </div>
</main>

<script src="js/common.js"></script>
<script src="js/pages/upio.js"></script>
</body>
</html>
